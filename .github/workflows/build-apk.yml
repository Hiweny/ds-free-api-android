name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ds_version:
        description: 'ds-free-api 版本号 (留空使用最新 Release)'
        required: false
        default: ''

permissions:
  contents: read

env:
  DS_FREE_API_REPO: "NIyueeE/ds-free-api"
  DS_BINARY_ASSET_PATH: "app/src/main/assets/ds-free-api"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 cmdline-tools;latest'

      - name: Download ds-free-api binary
        run: |
          mkdir -p app/src/main/assets

          # 使用已知的下载 URL 直接下载（最可靠的方式）
          # ds-free-api v0.2.6 aarch64-linux-gnu
          DOWNLOAD_URL="https://github.com/NIyueeE/ds-free-api/releases/download/v0.2.6/ds-free-api-v0.2.6-linux-aarch64-gnu.tar.gz"

          echo "下载 ds-free-api 二进制..."
          echo "URL: ${DOWNLOAD_URL}"

          curl -sS -L --connect-timeout 30 --max-time 120 \
            -o ds-free-api.tar.gz "${DOWNLOAD_URL}"

          if [ ! -f ds-free-api.tar.gz ]; then
            echo "错误: 下载失败"
            exit 1
          fi

          echo "下载完成，文件大小: $(stat -c%s ds-free-api.tar.gz) bytes"

          # 解压并提取二进制
          echo "解压..."
          tar -xzf ds-free-api.tar.gz
          echo "解压后的文件:"
          ls -la

          # 查找解压后的二进制文件
          BINARY=$(find . -maxdepth 3 -name "ds-free-api" -type f | head -1)
          if [ -z "${BINARY}" ]; then
            echo "错误: 解压后未找到 ds-free-api 二进制文件"
            find . -type f | head -20
            exit 1
          fi
          echo "找到二进制: ${BINARY}"
          cp "${BINARY}" "${{ env.DS_BINARY_ASSET_PATH }}"
          chmod +x "${{ env.DS_BINARY_ASSET_PATH }}"
          ls -la "${{ env.DS_BINARY_ASSET_PATH }}"
          file "${{ env.DS_BINARY_ASSET_PATH }}"

      - name: Verify assets
        run: |
          echo "=== Assets 目录内容 ==="
          ls -la app/src/main/assets/
          echo "=== 二进制文件类型 ==="
          file app/src/main/assets/ds-free-api || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Sign Release APK (debug key)
        if: success()
        run: |
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
              --ks $HOME/.android/debug.keystore \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out app/build/outputs/apk/release/app-release.apk \
              app/build/outputs/apk/release/app-release-unsigned.apk
            echo "Release APK 已签名"
          else
            echo "未找到 release APK，跳过签名"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ds-free-api-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ds-free-api-android-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload mapping files
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ds-free-api-android-mappings
          path: app/build/outputs/mapping/
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ds-free-api-android-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true