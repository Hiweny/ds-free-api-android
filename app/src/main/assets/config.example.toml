# 在管理面板中配置：http://127.0.0.1:22217/admin
# 中国手机号登录示例
# [[ds_core.accounts]]
# email = ""
# mobile = "13800138000"
# area_code = "+86"
# password = "your_password"

# 已验证通过的 User-Agent（Android 客户端模拟）
